<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buscador de Comandos</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface-2: #1c2129;
    --ink: #e6edf3;
    --muted: #8b949e;
    --line: #30363d;
    --accent: #3fb950;
    --accent-soft: #0f2c17;
    --accent-ink: #7ee2a0;
    --warn: #d29922;
    --warn-soft: #2e2510;
    --danger: #f85149;
    --danger-soft: #2c1517;
    --radius: 8px;
    --mono: "Cascadia Code", "Cascadia Mono", Consolas, "SFMono-Regular", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 14px;
    line-height: 1.5;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 20px 56px; }

  header.top { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; justify-content: space-between; margin-bottom: 18px; }
  h1 { margin: 0; font-size: 22px; font-weight: 600; }
  .sub { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; }

  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 13px; border-radius: 6px; }
  .btn:hover { border-color: #444c56; }
  .btn.small { padding: 5px 10px; font-size: 13px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #04140a; font-weight: 600; }
  .btn.primary:hover { background: #4fd864; }
  .btn.danger-outline { color: var(--danger); border-color: #5a2426; }

  .notice { background: var(--danger-soft); color: #ff8e87; border-radius: 6px; padding: 10px 14px; margin-bottom: 14px; }

  .filebar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 9px 14px; margin-bottom: 16px; font-size: 13px;
  }
  .filebar.attn { background: var(--warn-soft); border-color: #5a4a1d; }
  .filebar .grow { flex: 1 1 240px; }
  .filebar .muted { color: var(--muted); }
  .filebar .filemsg { flex-basis: 100%; color: #ff8e87; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .dot.ok { background: var(--accent); }
  .dot.warn { background: var(--warn); }

  .layout { display: grid; grid-template-columns: 320px 1fr; gap: 20px; align-items: start; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
  .form-card { padding: 18px; position: sticky; top: 18px; }
  .form-card h2 { margin: 0 0 12px; font-size: 15px; font-weight: 600; }
  fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
  fieldset:disabled { opacity: 0.4; }

  .field { margin-bottom: 11px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .field .opt { color: #5f6773; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 8px 10px; background: #0b0e14;
    border: 1px solid var(--line); border-radius: 6px; font-size: 13px;
  }
  .field textarea { resize: vertical; min-height: 62px; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
  .field .hint { color: #5f6773; font-size: 11px; margin-top: 3px; }
  .form-actions { display: flex; gap: 8px; margin-top: 4px; }
  .form-actions .primary { flex: 1; }
  .form-error { color: #ff8e87; font-size: 12px; min-height: 16px; margin: 0 0 6px; }

  .search-card { padding: 16px 18px; margin-bottom: 14px; }
  .search-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .search-row input[type=search] { flex: 1 1 260px; padding: 11px 13px; font-size: 14px; border: 1px solid var(--line); border-radius: 6px; background: #0b0e14; }
  .search-row input[type=search]:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
  .search-row select { padding: 11px 10px; border: 1px solid var(--line); border-radius: 6px; background: #0b0e14; }
  .count { color: var(--muted); font-size: 12px; margin-top: 8px; }

  .cat { margin-bottom: 16px; }
  .cat-head { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); padding: 0 4px 6px; }
  .results { list-style: none; margin: 0; padding: 0; }
  .item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 8px; }
  .item .cmd-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .item code {
    background: var(--surface-2); color: var(--accent-ink); padding: 5px 9px; border-radius: 6px;
    font-size: 13.5px; flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere;
  }
  .item .descs { margin: 8px 0 0; padding: 0; list-style: none; color: #c3cbd4; font-size: 13px; }
  .item .descs li { margin-bottom: 2px; }
  .item .descs li::before { content: "· "; color: var(--muted); }
  .item .tags { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { background: var(--surface-2); color: var(--muted); border-radius: 99px; padding: 2px 9px; font-size: 11px; }
  .item .actions { margin-top: 8px; display: flex; gap: 14px; }
  .link { background: none; border: 0; padding: 0; color: var(--accent-ink); font-size: 12px; }
  .link:hover { text-decoration: underline; }
  .link.danger { color: var(--danger); }

  .placeholders { margin-top: 8px; padding: 8px 10px; background: var(--surface-2); border-radius: 6px; display: none; }
  .placeholders.open { display: block; }
  .placeholders .ph-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .placeholders label { font-size: 12px; color: var(--muted); min-width: 90px; }
  .placeholders input { flex: 1; padding: 6px 8px; background: #0b0e14; border: 1px solid var(--line); border-radius: 5px; color: var(--ink); font: inherit; font-size: 13px; }
  .placeholders .preview { font-size: 12px; color: var(--muted); margin-top: 4px; word-break: break-all; }

  .copied-flash { color: var(--accent-ink); font-size: 12px; margin-left: 6px; opacity: 0; transition: opacity 0.15s; }
  .copied-flash.show { opacity: 1; }

  .empty { padding: 36px 18px; text-align: center; color: var(--muted); }

  footer.note { margin-top: 24px; color: var(--muted); font-size: 12px; }

  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
    .form-card { position: static; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <h1>Buscador de Comandos</h1>
      <p class="sub">Buscá por lo que querés hacer, copiá el comando y pegalo en tu terminal.</p>
    </div>
    <div class="tools">
      <button class="btn" id="btn-import" type="button">Importar JSON</button>
      <input type="file" id="file-import" accept=".json,application/json" multiple hidden>
    </div>
  </header>

  <div class="notice" id="notice" hidden role="alert"></div>
  <div class="filebar" id="filebar" hidden></div>

  <main class="layout">

    <aside class="card form-card">
      <h2 id="form-title">Agregar comando</h2>
      <form id="form" autocomplete="off" novalidate>
        <fieldset id="fs" disabled>
          <div class="field">
            <label for="f-categoria">Categoría</label>
            <input type="text" id="f-categoria" list="dl-categorias" placeholder="Ej: git, redes, docker" required>
            <datalist id="dl-categorias"></datalist>
          </div>
          <div class="field">
            <label for="f-comando">Comando</label>
            <input type="text" id="f-comando" placeholder="Ej: git reset --soft HEAD~1" required>
            <div class="hint">Usá &lt;ALGO&gt; para una parte que cambia, ej: lsof -i :&lt;PUERTO&gt;</div>
          </div>
          <div class="field">
            <label for="f-descripciones">Descripciones <span class="opt">(una por línea)</span></label>
            <textarea id="f-descripciones" placeholder="Deshacer el último commit guardando los cambios en staging&#10;Volver atrás un commit sin perder lo que escribí" required></textarea>
          </div>
          <div class="field">
            <label for="f-tags">Tags <span class="opt">(separados por coma)</span></label>
            <input type="text" id="f-tags" placeholder="git, undo, commit">
          </div>
          <p class="form-error" id="form-error" role="alert"></p>
          <div class="form-actions">
            <button class="btn primary" type="submit" id="btn-submit">Guardar comando</button>
            <button class="btn" type="button" id="btn-cancel" hidden>Cancelar</button>
          </div>
        </fieldset>
      </form>
    </aside>

    <section>
      <div class="card search-card">
        <div class="search-row">
          <input type="search" id="search" placeholder="Ej: deshacer commit, ver puerto ocupado, listar archivos...">
          <select id="filtro-categoria"><option value="">Todas las categorías</option></select>
        </div>
        <div class="count" id="count"></div>
      </div>

      <div id="list"></div>
    </section>

  </main>

  <footer class="note" id="foot"></footer>
</div>

<script>
(function () {
  var FS = typeof window.showSaveFilePicker === 'function' && typeof window.showOpenFilePicker === 'function';
  var PICK_TYPES = [{ description: 'Biblioteca de comandos (.json)', accept: { 'application/json': ['.json'] } }];
  var LOCAL_KEY = 'buscador-comandos-v1';

  var comandos = [];     // [{id, categoria, comando, descripciones:[], tags:[]}]
  var editingId = null;
  var status = FS ? 'loading' : 'local';
  var fileHandle = null;
  var fileMsg = '';
  var showChooser = false;
  var lastSaved = null;
  var writeQueue = Promise.resolve();

  var EJEMPLOS = [
    {
      id: 'git-soft-reset', categoria: 'git',
      comando: 'git reset --soft HEAD~1',
      descripciones: [
        'Deshacer el último commit guardando los cambios locales en staging',
        'Volver atrás un commit sin perder lo que escribí',
        'Descomitear el último cambio'
      ],
      tags: ['git', 'undo', 'commit', 'reset']
    },
    {
      id: 'check-port', categoria: 'redes',
      comando: 'lsof -i :<PUERTO>',
      descripciones: [
        'Ver qué proceso está usando un puerto específico',
        'Saber quién me está bloqueando el puerto',
        'Identificar aplicación por puerto en escucha'
      ],
      tags: ['puerto', 'red', 'lsof', 'proceso', 'kill']
    }
  ];

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function norm(s) {
    return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  }
  function slug(s) {
    var base = norm(s).replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
    return base || 'comando';
  }
  function uniqueId(base) {
    var id = base, n = 2;
    var existentes = {};
    comandos.forEach(function (c) { existentes[c.id] = true; });
    while (existentes[id]) { id = base + '-' + n; n++; }
    return id;
  }
  function canSave() { return status === 'ready' || status === 'local'; }
  function setNotice(msg) {
    var n = $('notice');
    if (msg) { n.textContent = msg; n.hidden = false; } else { n.hidden = true; }
  }

  /* ---------- memoria del archivo elegido (IndexedDB) ---------- */
  function idb() {
    return new Promise(function (res, rej) {
      var r = indexedDB.open('buscador-comandos-archivo', 1);
      r.onupgradeneeded = function () { r.result.createObjectStore('h'); };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
  }
  function idbGet(k) {
    return idb().then(function (db) {
      return new Promise(function (res, rej) {
        var q = db.transaction('h').objectStore('h').get(k);
        q.onsuccess = function () { res(q.result); };
        q.onerror = function () { rej(q.error); };
      });
    });
  }
  function idbSet(k, v) {
    return idb().then(function (db) {
      return new Promise(function (res, rej) {
        var t = db.transaction('h', 'readwrite');
        t.objectStore('h').put(v, k);
        t.oncomplete = function () { res(); };
        t.onerror = function () { rej(t.error); };
      });
    });
  }

  /* ---------- validar / normalizar entradas ---------- */
  function limpiarComando(c, i) {
    if (!c || typeof c.comando !== 'string' || !c.comando.trim()) throw new Error('formato');
    var descripciones = Array.isArray(c.descripciones)
      ? c.descripciones.map(function (d) { return String(d).trim(); }).filter(Boolean)
      : [];
    return {
      id: c.id ? String(c.id) : slug(c.comando) + '-' + (i || Date.now()),
      categoria: c.categoria ? String(c.categoria).trim() : 'general',
      comando: String(c.comando).trim(),
      descripciones: descripciones,
      tags: Array.isArray(c.tags) ? c.tags.map(function (t) { return String(t).trim(); }).filter(Boolean) : []
    };
  }
  function limpiarLista(arr) {
    if (!Array.isArray(arr)) throw new Error('formato');
    return arr.map(limpiarComando);
  }

  /* ---------- guardado en archivo ---------- */
  function readFile(h) {
    return h.getFile().then(function (f) { return f.text(); }).then(function (text) {
      if (!text.trim()) return [];
      var data = JSON.parse(text);
      return limpiarLista(Array.isArray(data) ? data : data.comandos);
    });
  }
  function ensurePerm(h) {
    return h.queryPermission({ mode: 'readwrite' }).then(function (p) {
      return p === 'granted' ? p : h.requestPermission({ mode: 'readwrite' });
    }).then(function (p) {
      if (p !== 'granted') throw new Error('perm');
    });
  }
  function persist() {
    if (status === 'local') { saveLocal(); return; }
    if (status !== 'ready' || !fileHandle) return;
    var h = fileHandle;
    var payload = JSON.stringify(comandos, null, 2);
    writeQueue = writeQueue.then(function () {
      return h.createWritable().then(function (w) {
        return w.write(payload).then(function () { return w.close(); });
      });
    }).then(function () {
      lastSaved = new Date();
      setNotice('');
      renderFileBar();
    }, function () {
      setNotice('No se pudo guardar en el archivo. Revisá que no esté abierto o bloqueado por otro programa y probá de nuevo.');
    });
  }
  function connect(h) {
    return ensurePerm(h).then(function () { return readFile(h); }).then(function (arr) {
      fileHandle = h; comandos = arr; status = 'ready';
      fileMsg = ''; showChooser = false; lastSaved = null;
      idbSet('file', h).catch(function () {});
      setNotice('');
      resetForm();
      render();
      renderFileBar();
    });
  }
  function onPickError(e) {
    if (e && e.name === 'AbortError') return;
    if (e && e.message === 'formato') fileMsg = 'Ese archivo no parece tener el formato esperado (una lista de comandos).';
    else if (e && e.message === 'perm') fileMsg = 'Sin permiso no se puede usar el archivo.';
    else fileMsg = 'No se pudo abrir el archivo. ¿Lo movieron o lo borraron?';
    renderFileBar();
  }
  function createFile() {
    window.showSaveFilePicker({ suggestedName: 'comandos.json', types: PICK_TYPES }).then(function (h) {
      return ensurePerm(h).then(function () {
        fileHandle = h; comandos = EJEMPLOS.map(function (c) { return Object.assign({}, c); }); status = 'ready';
        fileMsg = ''; showChooser = false;
        idbSet('file', h).catch(function () {});
        setNotice('');
        resetForm();
        persist();
        render();
        renderFileBar();
      });
    }).catch(onPickError);
  }
  function openFile() {
    window.showOpenFilePicker({ types: PICK_TYPES, multiple: false }).then(function (hs) {
      return connect(hs[0]);
    }).catch(onPickError);
  }
  function grant() { connect(fileHandle).catch(onPickError); }

  /* ---------- respaldo sin acceso a archivos ---------- */
  function loadLocal() {
    try {
      var raw = localStorage.getItem(LOCAL_KEY);
      comandos = raw ? limpiarLista(JSON.parse(raw)) : EJEMPLOS.map(function (c) { return Object.assign({}, c); });
    } catch (e) {
      comandos = EJEMPLOS.map(function (c) { return Object.assign({}, c); });
      setNotice('No se pudo leer lo guardado en este navegador.');
    }
  }
  function saveLocal() {
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(comandos)); }
    catch (e) { setNotice('No se pudo guardar en este navegador. Los comandos se perderán al cerrar la página.'); }
  }

  /* ---------- barra de estado del archivo ---------- */
  function chooserButtons() {
    return '<button type="button" class="btn small" data-fa="create">Crear archivo nuevo</button>' +
           '<button type="button" class="btn small" data-fa="open">Abrir archivo existente</button>';
  }
  function renderFileBar() {
    var el = $('filebar');
    var name = fileHandle ? esc(fileHandle.name) : '';
    var html = '', cls = 'filebar';
    if (status === 'loading') { el.hidden = true; updateEnabled(); return; }
    el.hidden = false;
    if (status === 'ready') {
      var when = lastSaved ? ' <span class="muted">· guardado a las ' + pad(lastSaved.getHours()) + ':' + pad(lastSaved.getMinutes()) + '</span>' : '';
      html = '<span class="dot ok"></span><span class="grow">Guardando en <b>' + name + '</b>' + when + '</span>' +
             '<button type="button" class="link" data-fa="toggle">Cambiar archivo</button>' +
             (showChooser ? chooserButtons() : '');
    } else if (status === 'needperm') {
      cls += ' attn';
      html = '<span class="dot warn"></span><span class="grow">Para seguir usando <b>' + name + '</b>, el navegador pide permiso otra vez.</span>' +
             '<button type="button" class="btn primary small" data-fa="grant">Permitir acceso</button>' +
             '<button type="button" class="link" data-fa="toggle">Usar otro archivo</button>' +
             (showChooser ? chooserButtons() : '');
    } else if (status === 'none') {
      cls += ' attn';
      html = '<span class="grow"><b>Elegí dónde guardar tu biblioteca de comandos.</b> Conviene que sea en la misma carpeta donde está esta herramienta.</span>' +
             chooserButtons();
    } else {
      cls += ' attn';
      html = '<span class="dot warn"></span><span class="grow">Este navegador no puede guardar en un archivo, así que los comandos quedan dentro del navegador. Para guardarlos en un archivo, abrí esta herramienta con Chrome o Edge.</span>';
    }
    if (fileMsg) html += '<div class="filemsg">' + esc(fileMsg) + '</div>';
    el.className = cls;
    el.innerHTML = html;
    updateEnabled();
  }
  function updateEnabled() {
    $('fs').disabled = !canSave();
    var foot = $('foot');
    foot.textContent = status === 'local'
      ? 'Tu biblioteca se guarda dentro de este navegador.'
      : 'Tu biblioteca se guarda en un archivo de tu computadora (por ejemplo comandos.json). Podés copiarlo como respaldo, o importar otros archivos JSON con el mismo formato.';
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }

  /* ---------- formulario ---------- */
  function resetForm() {
    $('form').reset();
    editingId = null;
    $('form-title').textContent = 'Agregar comando';
    $('btn-submit').textContent = 'Guardar comando';
    $('btn-cancel').hidden = true;
    $('form-error').textContent = '';
  }
  function startEdit(id) {
    var c = comandos.filter(function (x) { return x.id === id; })[0];
    if (!c) return;
    editingId = id;
    $('f-categoria').value = c.categoria;
    $('f-comando').value = c.comando;
    $('f-descripciones').value = c.descripciones.join('\n');
    $('f-tags').value = c.tags.join(', ');
    $('form-title').textContent = 'Editar comando';
    $('btn-submit').textContent = 'Guardar cambios';
    $('btn-cancel').hidden = false;
    $('form-error').textContent = '';
    $('f-categoria').focus();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function onSubmit(ev) {
    ev.preventDefault();
    if (!canSave()) { $('form-error').textContent = 'Primero elegí el archivo donde se guarda tu biblioteca.'; return; }
    var categoria = $('f-categoria').value.trim();
    var comando = $('f-comando').value.trim();
    var descripciones = $('f-descripciones').value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
    var tags = $('f-tags').value.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
    var err = '';
    if (!categoria) err = 'Escribí una categoría.';
    else if (!comando) err = 'Escribí el comando.';
    else if (!descripciones.length) err = 'Agregá al menos una descripción.';
    if (err) { $('form-error').textContent = err; return; }

    if (editingId) {
      comandos = comandos.map(function (c) {
        return c.id === editingId ? Object.assign({}, c, { categoria: categoria, comando: comando, descripciones: descripciones, tags: tags }) : c;
      });
    } else {
      comandos.push({ id: uniqueId(slug(comando)), categoria: categoria, comando: comando, descripciones: descripciones, tags: tags });
    }
    persist();
    resetForm();
    render();
  }

  /* ---------- búsqueda y listado ---------- */
  function coincide(c, tokens) {
    var hay = norm([c.categoria, c.comando, c.descripciones.join(' '), c.tags.join(' ')].join(' '));
    return tokens.every(function (t) { return hay.indexOf(t) !== -1; });
  }
  function render() {
    renderFiltroCategoria();
    renderSugerenciasCategoria();

    var q = norm($('search').value.trim());
    var tokens = q ? q.split(/\s+/) : [];
    var catFiltro = $('filtro-categoria').value;

    var lista = comandos.filter(function (c) {
      if (catFiltro && c.categoria !== catFiltro) return false;
      if (tokens.length && !coincide(c, tokens)) return false;
      return true;
    });

    $('count').textContent = comandos.length
      ? lista.length + ' de ' + comandos.length + ' comando' + (comandos.length === 1 ? '' : 's')
      : '';

    var box = $('list');
    if (!comandos.length) {
      box.innerHTML = canSave()
        ? '<div class="card empty">Todavía no tenés comandos guardados.<br>Agregá uno con el formulario o importá un archivo JSON.</div>'
        : '<div class="card empty">Elegí el archivo de datos para ver y agregar comandos.</div>';
      return;
    }
    if (!lista.length) {
      box.innerHTML = '<div class="card empty">No encontré ningún comando con esa búsqueda.</div>';
      return;
    }

    var porCategoria = {};
    var orden = [];
    lista.forEach(function (c) {
      if (!porCategoria[c.categoria]) { porCategoria[c.categoria] = []; orden.push(c.categoria); }
      porCategoria[c.categoria].push(c);
    });
    orden.sort();

    box.innerHTML = orden.map(function (cat) {
      var items = porCategoria[cat].map(renderItem).join('');
      return '<section class="cat"><div class="cat-head">' + esc(cat) + '</div><ul class="results">' + items + '</ul></section>';
    }).join('');
  }
  function renderItem(c) {
    var placeholders = (c.comando.match(/<[^<>]+>/g) || []).map(function (p) { return p.slice(1, -1); });
    var descs = c.descripciones.map(function (d) { return '<li>' + esc(d) + '</li>'; }).join('');
    var tags = c.tags.map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('');
    var phRows = placeholders.map(function (p, i) {
      return '<div class="ph-row"><label>' + esc(p) + '</label><input type="text" data-ph="' + esc(p) + '" placeholder="valor para ' + esc(p) + '"></div>';
    }).join('');
    return '<li class="item" data-id="' + esc(c.id) + '">' +
      '<div class="cmd-row">' +
        '<code>' + esc(c.comando) + '</code>' +
        '<button type="button" class="btn small" data-act="copiar" data-id="' + esc(c.id) + '">Copiar</button>' +
        '<span class="copied-flash" data-flash="' + esc(c.id) + '">copiado</span>' +
      '</div>' +
      (descs ? '<ul class="descs">' + descs + '</ul>' : '') +
      (tags ? '<div class="tags">' + tags + '</div>' : '') +
      (placeholders.length ? '<div class="placeholders" data-ph-box="' + esc(c.id) + '">' + phRows +
        '<div class="preview" data-preview="' + esc(c.id) + '"></div>' +
        '<button type="button" class="btn small" style="margin-top:6px" data-act="copiar-final" data-id="' + esc(c.id) + '">Copiar con estos valores</button>' +
      '</div>' : '') +
      '<div class="actions">' +
        '<button type="button" class="link" data-act="editar" data-id="' + esc(c.id) + '">Editar</button>' +
        '<button type="button" class="link danger" data-act="eliminar" data-id="' + esc(c.id) + '">Eliminar</button>' +
      '</div>' +
    '</li>';
  }
  function renderFiltroCategoria() {
    var sel = $('filtro-categoria');
    var actual = sel.value;
    var cats = Array.from(new Set(comandos.map(function (c) { return c.categoria; }))).sort();
    sel.innerHTML = '<option value="">Todas las categorías</option>' +
      cats.map(function (c) { return '<option value="' + esc(c) + '">' + esc(c) + '</option>'; }).join('');
    if (cats.indexOf(actual) !== -1) sel.value = actual;
  }
  function renderSugerenciasCategoria() {
    var cats = Array.from(new Set(comandos.map(function (c) { return c.categoria; }))).sort();
    $('dl-categorias').innerHTML = cats.map(function (c) { return '<option value="' + esc(c) + '">'; }).join('');
  }

  /* ---------- copiar al portapapeles ---------- */
  function copiarTexto(texto) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(texto).catch(function () { return copiarFallback(texto); });
    }
    return copiarFallback(texto);
  }
  function copiarFallback(texto) {
    return new Promise(function (resolve, reject) {
      var ta = document.createElement('textarea');
      ta.value = texto;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      ok ? resolve() : reject(new Error('copy-failed'));
    });
  }
  function flash(id) {
    var el = document.querySelector('[data-flash="' + CSS.escape(id) + '"]');
    if (!el) return;
    el.classList.add('show');
    setTimeout(function () { el.classList.remove('show'); }, 1200);
  }

  /* ---------- importar JSON ---------- */
  function importarArchivos(files) {
    if (!canSave()) { setNotice('Primero elegí dónde guardar tu biblioteca antes de importar.'); return; }
    var lecturas = Array.from(files).map(function (f) {
      return f.text().then(function (texto) {
        try {
          var data = JSON.parse(texto);
          return limpiarLista(Array.isArray(data) ? data : data.comandos);
        } catch (e) {
          return { error: f.name };
        }
      });
    });
    Promise.all(lecturas).then(function (resultados) {
      var agregados = 0, repetidos = 0, archivosConError = [];
      resultados.forEach(function (r) {
        if (r && r.error) { archivosConError.push(r.error); return; }
        r.forEach(function (c) {
          if (comandos.some(function (ex) { return ex.id === c.id; })) { repetidos++; return; }
          comandos.push(c);
          agregados++;
        });
      });
      var partes = [];
      if (agregados) partes.push(agregados + ' comando' + (agregados === 1 ? '' : 's') + ' importado' + (agregados === 1 ? '' : 's'));
      if (repetidos) partes.push(repetidos + ' repetido' + (repetidos === 1 ? '' : 's') + ' (se omitieron)');
      if (archivosConError.length) partes.push('no se pudo leer: ' + archivosConError.join(', '));
      setNotice(partes.length ? partes.join(' · ') : null);
      if (agregados) { persist(); render(); }
    });
  }

  /* ---------- eventos ---------- */
  $('form').addEventListener('submit', onSubmit);
  $('btn-cancel').addEventListener('click', resetForm);
  $('search').addEventListener('input', render);
  $('filtro-categoria').addEventListener('change', render);
  $('btn-import').addEventListener('click', function () { $('file-import').click(); });
  $('file-import').addEventListener('change', function (e) {
    if (e.target.files.length) importarArchivos(e.target.files);
    e.target.value = '';
  });
  $('filebar').addEventListener('click', function (e) {
    var b = e.target.closest('[data-fa]');
    if (!b) return;
    var a = b.getAttribute('data-fa');
    if (a === 'create') createFile();
    else if (a === 'open') openFile();
    else if (a === 'grant') grant();
    else if (a === 'toggle') { showChooser = !showChooser; renderFileBar(); }
  });
  $('list').addEventListener('input', function (e) {
    var input = e.target.closest('input[data-ph]');
    if (!input) return;
    var box = input.closest('.placeholders');
    var id = box.getAttribute('data-ph-box');
    var c = comandos.filter(function (x) { return x.id === id; })[0];
    if (!c) return;
    var final = c.comando;
    box.querySelectorAll('input[data-ph]').forEach(function (i) {
      var ph = i.getAttribute('data-ph');
      var val = i.value.trim();
      final = final.split('<' + ph + '>').join(val || '<' + ph + '>');
    });
    var prev = box.querySelector('[data-preview]');
    if (prev) prev.textContent = final;
  });
  $('list').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-act]');
    if (!b) return;
    var id = b.getAttribute('data-id');
    var c = comandos.filter(function (x) { return x.id === id; })[0];
    var act = b.getAttribute('data-act');

    if (act === 'copiar') {
      var tienePlaceholder = /<[^<>]+>/.test(c.comando);
      if (tienePlaceholder) {
        var box = document.querySelector('[data-ph-box="' + CSS.escape(id) + '"]');
        if (box) {
          box.classList.toggle('open');
          if (box.classList.contains('open')) {
            var first = box.querySelector('input[data-ph]');
            if (first) first.focus();
          }
          return;
        }
      }
      copiarTexto(c.comando).then(function () { flash(id); });
    } else if (act === 'copiar-final') {
      var prev = document.querySelector('[data-preview="' + CSS.escape(id) + '"]');
      var texto = (prev && prev.textContent) ? prev.textContent : c.comando;
      copiarTexto(texto).then(function () { flash(id); });
    } else if (act === 'editar') {
      startEdit(id);
    } else if (act === 'eliminar') {
      if (confirm('¿Eliminar este comando? No se puede deshacer.')) {
        comandos = comandos.filter(function (x) { return x.id !== id; });
        if (editingId === id) resetForm();
        persist();
        render();
      }
    }
  });

  /* ---------- inicio ---------- */
  resetForm();
  render();
  renderFileBar();

  if (!FS) {
    loadLocal();
    render();
  } else {
    idbGet('file').then(function (h) {
      if (!h) { status = 'none'; return; }
      fileHandle = h;
      return h.queryPermission({ mode: 'readwrite' }).then(function (p) {
        if (p === 'granted') return connect(h);
        status = 'needperm';
      });
    }).catch(function () {
      if (status === 'loading') {
        if (fileHandle) { status = 'needperm'; fileMsg = 'No se pudo abrir el archivo anterior. Permití el acceso o elegí otro.'; }
        else status = 'none';
      }
    }).then(function () {
      renderFileBar();
      render();
    });
  }
})();
</script>
</body>
</html>
